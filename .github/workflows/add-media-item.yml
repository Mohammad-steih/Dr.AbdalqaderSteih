name: Add media appearance item
on: push
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  add-item:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add image
        env:
          IMG_BLOB_SHA: 1a8e6a5f0061abd356cecdaf4942f03111ed6953
        run: gh api "repos/$GITHUB_REPOSITORY/git/blobs/$IMG_BLOB_SHA" --jq .content | tr -d '\n' | base64 -d > assets/abd1.jpeg
      - name: Add cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cards = {
          'ar/index.html': '''        <a href="https://www.youtube.com/watch?v=xia8qBM3Avs" target="_blank" rel="noopener noreferrer" class="timeline-card">
          <img src="assets/abd1.jpeg" loading="lazy" alt="كيف أثر القانون العثماني على ملكية الأراضي في فلسطين؟">
          <div class="timeline-content">
            <h3>كيف أثر القانون العثماني على ملكية الأراضي في فلسطين؟</h3>
            <p>كيف أثر القانون العثماني على ملكية الأراضي في فلسطين؟ عن ذلك يحدثنا المختص في التاريخ العثماني د. عبد القادر سطيح من خلال عدة محاور مرتبطة بالماضي والحاضر والمستقبل</p>
          </div>
        </a>\n\n''',
          'en/index.html': '''        <a href="https://www.youtube.com/watch?v=xia8qBM3Avs" target="_blank" rel="noopener noreferrer" class="timeline-card">
          <img src="assets/abd1.jpeg" loading="lazy" alt="How Did Ottoman Law Affect Land Ownership in Palestine?">
          <div class="timeline-content">
            <h3>How Did Ottoman Law Affect Land Ownership in Palestine?</h3>
            <p>How did Ottoman law affect land ownership in Palestine? Dr. Abdalqader Steih, a specialist in Ottoman history, discusses this through several themes connected to the past, present, and future.</p>
          </div>
        </a>\n\n''',
          'tr/index.html': '''        <a href="https://www.youtube.com/watch?v=xia8qBM3Avs" target="_blank" rel="noopener noreferrer" class="timeline-card">
          <img src="assets/abd1.jpeg" loading="lazy" alt="Osmanlı Hukuku Filistin'de Arazi Mülkiyetini Nasıl Etkiledi?">
          <div class="timeline-content">
            <h3>Osmanlı Hukuku Filistin'de Arazi Mülkiyetini Nasıl Etkiledi?</h3>
            <p>Osmanlı hukuku Filistin'de arazi mülkiyetini nasıl etkiledi? Osmanlı tarihi uzmanı Dr. Abdalqader Steih, geçmiş, bugün ve gelecekle bağlantılı çeşitli başlıklar üzerinden bu konuyu ele alıyor.</p>
          </div>
        </a>\n\n'''}
          marker = '<div class="timeline-track">\n'
          for path, card in cards.items():
              p=Path(path); s=p.read_text(encoding='utf-8')
              if card.strip() not in s: p.write_text(s.replace(marker, marker+'\n'+card, 1), encoding='utf-8')
          Path('.github/workflows/add-media-item.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/abd1.jpeg ar/index.html en/index.html tr/index.html .github/workflows/add-media-item.yml
          git commit -m "feat: add new media appearance item" || exit 0
          git push
